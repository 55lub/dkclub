<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Project</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050e0c;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:380px;background:#0a1a17;min-height:100vh;position:relative}
.page{display:none;padding:20px;min-height:100vh}
.page.active{display:block}
h2{color:#d4b072;text-align:center;margin:30px 0 20px;font-size:24px}
.input{width:100%;height:48px;background:#122922;border:1px solid #1e3d32;border-radius:10px;color:#fff;padding:0 15px;margin:10px 0;font-size:15px}
.btn{width:100%;height:50px;background:linear-gradient(90deg,#ffdd55,#ff8800);border:none;border-radius:25px;font-weight:900;font-size:16px;margin-top:15px;cursor:pointer}
.link{color:#5a7a6e;text-align:center;margin-top:15px;font-size:13px}
.link b{color:#d4b072;cursor:pointer}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.game-box{background:#122922;border:1px solid #1e3d32;border-radius:14px;padding:20px;text-align:center;font-size:40px}
.game-box span{display:block;font-size:13px;margin-top:8px;color:#fff}
.top-bar{background:#0c1f1a;padding:15px;display:flex;justify-content:space-between;color:#fff;border-bottom:1px solid #1e3d32}
.top-bar b{color:#ffdd55}
</style>
</head>
<body>
<div class="phone">

<!-- REGISTER PAGE -->
<div id="p-register" class="page active">
<h2>Register</h2>
<input class="input" id="r-name" placeholder="Name">
<input class="input" id="r-mobile" placeholder="Mobile Number">
<input class="input" id="r-pass" type="password" placeholder="Password">
<button class="btn" onclick="doRegister()">REGISTER</button>
<div class="link">Already have account? <b onclick="showPage('login')">Login</b></div>
</div>

<!-- LOGIN PAGE -->
<div id="p-login" class="page">
<h2>Login</h2>
<input class="input" id="l-mobile" placeholder="Mobile Number">
<input class="input" id="l-pass" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">LOGIN</button>
<div class="link">No account? <b onclick="showPage('register')">Register</b></div>
</div>

<!-- HOME PAGE - LOGIN PACHI AA KHULSE -->
<div id="p-home" class="page">
<div class="top-bar">
<div>Hi, <b id="u-name">User</b></div>
<div>₹<b id="u-bal">5000</b></div>
</div>
<h2>Select Game</h2>
<div class="games">
<div class="game-box" onclick="alert('Wingo Game open thase')">🎨<span>WinGo</span></div>
<div class="game-box" onclick="alert('Aviator Game open thase')">✈️<span>Aviator</span></div>
<div class="game-box" onclick="alert('Mines Game open thase')">💣<span>Mines</span></div>
<div class="game-box" onclick="alert('Slots Game open thase')">🎰<span>Slots</span></div>
</div>
<button class="btn" style="background:#122922;color:#fff;border:1px solid #444;margin-top:30px" onclick="showPage('login')">Logout</button>
</div>

</div>

<script>
function showPage(t){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('p-'+t).classList.add('active');
}
function doRegister(){
 let n=document.getElementById('r-name').value;
 let m=document.getElementById('r-mobile').value;
 let p=document.getElementById('r-pass').value;
 if(!n||!m||!p){alert('Badhu bhar');return}
 localStorage.setItem('game_user',JSON.stringify({name:n,mobile:m,pass:p}));
 alert('Register thai gayu! Have Login karo');
 showPage('login');
}
function doLogin(){
 let m=document.getElementById('l-mobile').value;
 let p=document.getElementById('l-pass').value;
 let u=JSON.parse(localStorage.getItem('game_user')||'null');
 if(!u){alert('Pela Register karo');return}
 if(u.mobile==m && u.pass==p){
   document.getElementById('u-name').innerText=u.name;
   showPage('home');
 }else{
   alert('Mobile ya Password khoto che');
 }
}
</script>
</body>
  </html>
