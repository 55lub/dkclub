<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Project - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#050e0c;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:400px;background:#0a1a17;min-height:100vh;position:relative;overflow:hidden}
.page{display:none;min-height:100vh}
.page.active{display:block}
h2{color:#d4b072;text-align:center;margin:25px 0 15px;font-size:26px;letter-spacing:1px}
.input{width:90%;margin:10px 5%;height:48px;background:#122922;border:1px solid #1e3d32;border-radius:10px;color:#fff;padding:0 15px;font-size:15px;outline:none}
.btn{width:90%;margin:15px 5%;height:52px;background:linear-gradient(90deg,#ffdd55,#ff8800);border:none;border-radius:28px;font-weight:900;font-size:16px;cursor:pointer;color:#000}
.link{color:#5a7a6e;text-align:center;margin-top:15px;font-size:13px}
.link b{color:#d4b072;cursor:pointer}

/* TOP BAR AFTER LOGIN */
.top-bar{background:#0c1f1a;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:#fff;border-bottom:1px solid #1e3d32}
.top-bar .left{font-size:14px;color:#8a9e94}
.top-bar b{color:#ffdd55;font-size:15px}
.balance{background:#122922;border:1px solid #1e3d32;padding:6px 12px;border-radius:20px;font-size:13px}

/* GAME CATEGORY BOXES */
.section{padding:12px}
.cat-title{color:#5a7a6e;font-size:12px;letter-spacing:1.5px;margin:18px 0 10px 4px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.box{
background:linear-gradient(145deg,#132a23,#0e1f1a);
border:1px solid #1e3d32;
border-radius:18px;
padding:18px 10px;
text-align:center;
cursor:pointer;
position:relative;
overflow:hidden;
transition:0.2s;
}
.box:active{transform:scale(0.97)}
.box-icon{font-size:38px;margin-bottom:8px;display:block}
.box-name{color:#fff;font-weight:900;font-size:16px;letter-spacing:0.5px}
.box-sub{color:#6b8a7d;font-size:11px;margin-top:4px}

.box.lottery{border-color:#ff6b35}
.box.lottery .box-icon{filter:drop-shadow(0 0 10px #ff6b35)}
.box.jili{border-color:#00e5ff}
.box.jili .box-icon{filter:drop-shadow(0 0 10px #00e5ff)}
.box.jdb{border-color:#a259ff}
.box.jdb .box-icon{filter:drop-shadow(0 0 10px #a259ff)}
.box.pg{border-color:#33ff88}
.box.pg .box-icon{filter:drop-shadow(0 0 10px #33ff88)}
</style>
</head>
<body>
<div class="phone">

<!-- 1. REGISTER PAGE -->
<div id="p-register" class="page active">
<h2>Register</h2>
<input class="input" id="r-name" placeholder="Name">
<input class="input" id="r-mobile" placeholder="Mobile Number">
<input class="input" id="r-pass" type="password" placeholder="Password">
<button class="btn" onclick="doRegister()">REGISTER NOW</button>
<div class="link">Already have account? <b onclick="showPage('login')">Login</b></div>
</div>

<!-- 2. LOGIN PAGE -->
<div id="p-login" class="page">
<h2>Login</h2>
<input class="input" id="l-mobile" placeholder="Mobile Number">
<input class="input" id="l-pass" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">LOGIN</button>
<div class="link">No account? <b onclick="showPage('register')">Register</b></div>
</div>

<!-- 3. HOME PAGE - LOGIN KE BAD YE KHULEGA -->
<div id="p-home" class="page">
<div class="top-bar">
<div class="left">Hi, <b id="u-name">Player</b></div>
<div class="balance">₹ <b id="u-bal">5000.00</b></div>
</div>

<div class="section">
<div class="cat-title">All Games</div>
<div class="grid">
<div class="box lottery" onclick="openGame('Lottery')">
<span class="box-icon">🎟️</span>
<div class="box-name">LOTTERY</div>
<div class="box-sub">Win Go • K3 • 5D</div>
</div>

<div class="box jili" onclick="openGame('JILI')">
<span class="box-icon">🎰</span>
<div class="box-name">JILI</div>
<div class="box-sub">Slots • Fishing • Crash</div>
</div>

<div class="box jdb" onclick="openGame('JDB')">
<span class="box-icon">🃏</span>
<div class="box-name">JDB</div>
<div class="box-sub">Casino • Poker • Baccarat</div>
</div>

<div class="box pg" onclick="openGame('PG')">
<span class="box-icon">🐉</span>
<div class="box-name">PG</div>
<div class="box-sub">Soft • Adventure • New</div>
</div>
</div>

<div class="cat-title">Hot Games</div>
<div class="grid">
<div class="box" style="border-color:#ffdd55" onclick="openGame('Aviator')">
<span class="box-icon">✈️</span>
<div class="box-name">Aviator</div>
<div class="box-sub">Most Played</div>
</div>
<div class="box" style="border-color:#ff3b3b" onclick="openGame('Mines')">
<span class="box-icon">💣</span>
<div class="box-name">Mines</div>
<div class="box-sub">Instant Win</div>
</div>
</div>

<button class="btn" style="background:#122922;color:#888;border:1px solid #2a3d35;margin-top:30px" onclick="showPage('login')">Logout</button>
</div>
</div>

</div>

<script>
function showPage(t){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('p-'+t).classList.add('active');
}
function doRegister(){
 let n=document.getElementById('r-name').value.trim();
 let m=document.getElementById('r-mobile').value.trim();
 let p=document.getElementById('r-pass').value.trim();
 if(!n||!m||!p){alert('Badhu bharo bhai');return}
 localStorage.setItem('game_user',JSON.stringify({name:n,mobile:m,pass:p}));
 alert('Register Success! Have Login karo');
 showPage('login');
}
function doLogin(){
 let m=document.getElementById('l-mobile').value.trim();
 let p=document.getElementById('l-pass').value.trim();
 let u=JSON.parse(localStorage.getItem('game_user')||'null');
 if(!u){alert('Pela Register karo');showPage('register');return}
 if(u.mobile==m && u.pass==p){
   document.getElementById('u-name').innerText=u.name;
   showPage('home');
 }else{
   alert('Mobile ya Password khoto che');
 }
}
function openGame(name){
 alert(name + ' Game Page Haju Banavanu Baki Che\nTu ke to hu e pan banavi dau');
}
</script>
</body>
 </html>
