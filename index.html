<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Games - Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;display:flex;justify-content:center}
.phone{width:100%;max-width:400px;background:#07130f;min-height:100vh;position:relative}
.page{display:none;padding:15px;min-height:100vh}
.page.active{display:block}
h2{color:gold;text-align:center;margin:20px 0}
input{width:100%;height:50px;background:#11251f;border:1px solid #2a4a3f;border-radius:12px;color:#fff;padding:0 15px;margin:8px 0}
.btn{width:100%;height:52px;background:gold;border:none;border-radius:30px;font-weight:900;font-size:17px;margin-top:12px;cursor:pointer}
.top{background:#0f261e;padding:12px;border-radius:12px;display:flex;justify-content:space-between;color:#fff;margin-bottom:15px;border:1px solid #234a3d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:10px}
.game-card{height:130px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;cursor:pointer}
.game-card span{font-size:40px;margin-bottom:6px}
#card1{background:linear-gradient(135deg,#ff5e00,#ff9a00)}
#card2{background:linear-gradient(135deg,#00c6ff,#0072ff)}
#card3{background:linear-gradient(135deg,#a100ff,#ff00c8)}
#card4{background:linear-gradient(135deg,#00ff88,#00a651)}
.notice{background:#11251f;border:1px solid #2a4a3f;padding:10px;border-radius:10px;color:#8aa89c;font-size:12px;text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="phone">

<div id="p-reg" class="page active">
<h2>REGISTER</h2>
<input id="r1" placeholder="Name">
<input id="r2" placeholder="Mobile">
<input id="r3" type="password" placeholder="Password">
<button class="btn" onclick="reg()">REGISTER</button>
<p style="color:#aaa;text-align:center;margin-top:15px;font-size:13px" onclick="show('login')">Login? <b style="color:gold">Login</b></p>
</div>

<div id="p-login" class="page">
<h2>LOGIN</h2>
<input id="l1" placeholder="Mobile">
<input id="l2" type="password" placeholder="Password">
<button class="btn" onclick="log()">LOGIN</button>
<p style="color:#aaa;text-align:center;margin-top:15px;font-size:13px" onclick="show('reg')">New? <b style="color:gold">Register</b></p>
</div>

<div id="p-home" class="page">
<div class="top"><div id="uname">Hi Player</div><div>₹<b id="bal">5000</b></div></div>
<h2 style="margin:10px 0">SELECT PROVIDER</h2>
<div class="grid">
<div class="game-card" id="card1"><span>🎟️</span>LOTTERY</div>
<div class="game-card" id="card2" onclick="openJili()"><span>🎰</span>JILI</div>
<div class="game-card" id="card3"><span>🎲</span>JDB</div>
<div class="game-card" id="card4"><span>🐯</span>PG</div>
</div>
<div class="notice">JILI par click karo etle Balance JILI Wallet ma jase ane Game khul se</div>
<button class="btn" style="background:#11251f;color:#fff;border:1px solid #333;margin-top:20px" onclick="show('login')">Logout</button>
</div>

</div>

<script>
let balance = 5000;
function show(name){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('p-'+name).classList.add('active');
}
function reg(){
let n=document.getElementById('r1').value.trim();
let m=document.getElementById('r2').value.trim();
let p=document.getElementById('r3').value.trim();
if(!n||!m||!p){alert('Badhu bharo');return}
localStorage.setItem('u',JSON.stringify({n,m,p}));
alert('Register OK');show('login');
}
function log(){
let m=document.getElementById('l1').value.trim();
let p=document.getElementById('l2').value.trim();
let u=JSON.parse(localStorage.getItem('u')||'null');
if(!u){alert('Pela Register');show('reg');return}
if(u.m==m && u.p==p){
document.getElementById('uname').innerText='Hi, '+u.n;
document.getElementById('bal').innerText=balance;
show('home');
}else{alert('Password Khoto');}
}
function openJili(){
// 1. Paisa transfer no logic
localStorage.setItem('jili_balance', balance);
alert('₹'+balance+' JILI Wallet ma transfer thai gaya! Have Game khulse.');

// 2. FIX - Iframe na badle direct open karvu
window.open("https://jiligames.com/", "_blank");
// Jo same j window ma kholvu hoy to aa line use kar:
// window.location.href = "https://jiligames.com/";
}
</script>
</body>
 </html>
                                                        </html>
