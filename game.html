<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Gold</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:360px;background:#10221c;border:2px solid gold;border-radius:22px;padding:18px;text-align:center}
.top{display:flex;justify-content:space-between;color:gold;font-weight:700;margin-bottom:12px}
.reels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:#050a08;padding:14px;border-radius:16px}
.reel{height:75px;background:#fff;border-radius:12px;display:flex;justify-content:center;align-items:center;border:1px solid gold}
.reel img{width:50px;height:50px}
.btn{width:100%;padding:16px;background:gold;border:none;border-radius:30px;font-weight:900;font-size:18px;margin-top:14px}
.win{color:#00ff88;font-weight:900;margin-top:10px;height:22px}
</style>
</head>
<body>
<div class="box">
  <div class="top"><span>GOLD SPIN GAMES</span><span id="bal">₹ 10000</span></div>
  <div class="reels">
    <div class="reel"><img id="r1" src="https://cdn-icons-png.flaticon.com/512/2583/2583344.png"></div>
    <div class="reel"><img id="r2" src="https://cdn-icons-png.flaticon.com/512/2583/2583344.png"></div>
    <div class="reel"><img id="r3" src="https://cdn-icons-png.flaticon.com/512/2583/2583344.png"></div>
    <div class="reel"><img id="r4" src="https://cdn-icons-png.flaticon.com/512/138/138292.png"></div>
    <div class="reel"><img id="r5" src="https://cdn-icons-png.flaticon.com/512/138/138292.png"></div>
    <div class="reel"><img id="r6" src="https://cdn-icons-png.flaticon.com/512/138/138292.png"></div>
    <div class="reel"><img id="r7" src="https://cdn-icons-png.flaticon.com/512/415/415102.png"></div>
    <div class="reel"><img id="r8" src="https://cdn-icons-png.flaticon.com/512/415/415102.png"></div>
    <div class="reel"><img id="r9" src="https://cdn-icons-png.flaticon.com/512/415/415102.png"></div>
  </div>
  <div class="win" id="winMsg">SPIN dabavo</div>
  <button class="btn" onclick="spin()">SPIN - ₹100</button>
</div>
<script>
let balance=10000;
const pics=[
"https://cdn-icons-png.flaticon.com/512/2583/2583344.png",
"https://cdn-icons-png.flaticon.com/512/138/138292.png",
"https://cdn-icons-png.flaticon.com/512/415/415102.png",
"https://cdn-icons-png.flaticon.com/512/891/891462.png"
];
function spin(){
 balance-=100; document.getElementById('bal').innerText="₹ "+balance;
 document.getElementById('winMsg').innerText="";
 let c=0; let t=setInterval(()=>{
  for(let i=1;i<=9;i++) document.getElementById('r'+i).src=pics[Math.floor(Math.random()*pics.length)];
  c++; if(c>15){clearInterval(t); checkWin();}
 },80);
}
function checkWin(){
 let a=document.getElementById('r1').src, b=document.getElementById('r2').src, c=document.getElementById('r3').src;
 if(a==b && b==c){balance+=500; document.getElementById('bal').innerText="₹ "+balance; document.getElementById('winMsg').innerText="🎉 WIN ₹500";}
 else{document.getElementById('winMsg').innerText="Try Again";}
}
</script>
</body>
  </html>
