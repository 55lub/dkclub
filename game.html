<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Game Upload</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:350px;background:#10221c;border:2px solid gold;border-radius:20px;padding:15px;text-align:center;color:#fff}
.reels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.reel{height:70px;border-radius:12px;background:#fff;display:flex;justify-content:center;align-items:center;overflow:hidden;border:1px solid gold}
.reel img{width:100%;height:100%;object-fit:cover}
.btn{width:100%;padding:12px;background:gold;border:none;border-radius:30px;font-weight:900;margin-top:8px}
input{margin:8px 0;color:#fff}
</style>
</head>
<body>
<div class="box">
<div style="color:gold;font-weight:700">GALLERY THI PHOTO NAKHO</div>
<input type="file" id="file1" accept="image/*">
<div class="reels">
<div class="reel"><img id="r1" src=""></div>
<div class="reel"><img id="r2" src=""></div>
<div class="reel"><img id="r3" src=""></div>
<div class="reel"><img id="r4" src=""></div>
<div class="reel"><img id="r5" src=""></div>
<div class="reel"><img id="r6" src=""></div>
<div class="reel"><img id="r7" src=""></div>
<div class="reel"><img id="r8" src=""></div>
<div class="reel"><img id="r9" src=""></div>
</div>
<button class="btn" onclick="spin()">SPIN</button>
</div>
<script>
let selImg="";
document.getElementById('file1').onchange=function(e){
 let reader=new FileReader();
 reader.onload=function(ev){selImg=ev.target.result; for(let i=1;i<=9;i++) document.getElementById('r'+i).src=selImg;}
 reader.readAsDataURL(e.target.files[0]);
}
function spin(){
 if(!selImg){alert("Pela upar thi gallery mathi photo pasand karo");return;}
 // shuffle same photo for demo
 for(let i=1;i<=9;i++) document.getElementById('r'+i).src=selImg;
}
</script>
</body>
                    </html>
